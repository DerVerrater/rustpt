[package]
name = "rustpt"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "rustpt_cli"
path = "src/cli_tool.rs"

[[bin]]
name = "rustpt_gui"
path = "src/gui_tool.rs"

[dependencies]
rand = { version = "0.8.5", features = ["small_rng"] }
itertools = { version = "0.11.0" }
eframe = "0.25.0"
